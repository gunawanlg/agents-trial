[build-system]
requires = ["setuptools>=40.8,<60"]
build-backend = "setuptools.build_meta"

[project]
name = "scorecard-segment-eval"
version = "0.1.0"
description = "Sub-population evaluation for logistic scorecards: performance verdict and split vs pooled."
requires-python = ">=3.6"
dependencies = [
  "numpy>=1.17",
  "pandas>=1.1",
  "scikit-learn>=0.24",
  "scipy>=1.5",
  "dataclasses>=0.8; python_version<'3.7'",
]

[project.optional-dependencies]
dev = ["pytest>=6.2"]

[tool.setuptools.packages.find]
include = ["scorecard_segment_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
