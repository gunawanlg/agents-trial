[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorecard-segment-eval"
version = "0.1.0"
description = "Sub-population evaluation for logistic scorecards: performance verdict and split vs pooled."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["scorecard_segment_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
