[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scorecard-segment-eval"
version = "0.2.0"
description = "Sub-population evaluation for logistic scorecards: performance verdict and split vs pooled."
requires-python = ">=3.6"
dependencies = [
  "numpy>=1.16",
  "pandas>=0.24",
  "scikit-learn>=0.22",
  "scipy>=1.2",
  "dataclasses>=0.6; python_version<'3.7'",
]

[project.optional-dependencies]
dev = ["pytest>=4.6"]
xgb = ["xgboost>=0.90"]
optbinning = ["optbinning>=0.8"]
notebook = ["ipywidgets>=7.5"]

[tool.setuptools.packages.find]
include = ["scorecard_segment_eval*"]

[tool.setuptools.package-data]
scorecard_segment_eval = ["sql/*.sql", "sql/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
